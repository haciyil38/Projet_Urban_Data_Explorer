version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: paris-data
    environment:
      POSTGRES_DB: paris_indicators
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paris_indicators"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
