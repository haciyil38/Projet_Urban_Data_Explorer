services:
  db:
    image: postgis/postgis:16-3.4
    container_name: paris-data
    environment:
      POSTGRES_DB: paris_indicators
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d paris_indicators" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6.0
    container_name: paris-datalake
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7-alpine
    container_name: paris-cache
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongo_data:
